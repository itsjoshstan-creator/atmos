name: Build Atmos Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Atmos-Source-*.zip'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select newest Atmos source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP=$(find . -maxdepth 1 -type f -name 'Atmos-Source-*.zip' -printf '%f\n' \
            | sort -V \
            | tail -n 1)

          if [ -z "${SOURCE_ZIP}" ]; then
            echo "No Atmos-Source-*.zip file was found in the repository root."
            exit 1
          fi

          echo "Selected source: ${SOURCE_ZIP}"
          echo "zip=${SOURCE_ZIP}" >> "$GITHUB_OUTPUT"

      - name: Extract selected source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q "${{ steps.source.outputs.zip }}" -d project

          # Support ZIPs containing either android/ directly or project/android/.
          if [ -f project/android/gradlew ]; then
            echo "ANDROID_DIR=project/android" >> "$GITHUB_ENV"
          elif [ -f project/project/android/gradlew ]; then
            echo "ANDROID_DIR=project/project/android" >> "$GITHUB_ENV"
          else
            echo "Could not find android/gradlew in the selected source ZIP."
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            ${{ env.ANDROID_DIR }}/**/*.gradle*
            ${{ env.ANDROID_DIR }}/**/gradle-wrapper.properties
            ${{ env.ANDROID_DIR }}/gradle/*.versions.toml

      - name: Read Atmos version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="${ANDROID_DIR}/app/build.gradle"
          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+["'\'']([^"'\'']+)["'\''].*/\1/p' "$BUILD_FILE" | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Unable to read versionName from ${BUILD_FILE}."
            exit 1
          fi

          echo "Building Atmos ${VERSION}"
          echo "number=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x "${ANDROID_DIR}/gradlew"

      - name: Build performance APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew --no-daemon --stacktrace assemblePerformance

      - name: Name APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          APK=$(find "${ANDROID_DIR}/app/build/outputs/apk/performance" -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No performance APK was generated."
            exit 1
          fi

          OUTPUT="release/Atmos-${{ steps.version.outputs.number }}.apk"
          cp "$APK" "$OUTPUT"
          echo "Prepared ${OUTPUT}"

      - name: Remove older build artifacts
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Keep the five newest artifacts and remove the rest before uploading.
          artifact_ids=$(gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GH_REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[5:] | .[].id')

          if [ -z "$artifact_ids" ]; then
            echo "No older artifacts to remove."
            exit 0
          fi

          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            echo "Deleting artifact ${artifact_id}"
            gh api --method DELETE "/repos/${GH_REPO}/actions/artifacts/${artifact_id}"
          done <<< "$artifact_ids"

      - name: Upload Atmos APK
        uses: actions/upload-artifact@v4
        with:
          name: Atmos-${{ steps.version.outputs.number }}
          path: release/Atmos-${{ steps.version.outputs.number }}.apk
          if-no-files-found: error
          retention-days: 1
