name: Build Atmos Performance APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q Atmos-Source-0.64.7-Fixed.zip -d project
          test -f project/android/gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            project/android/*.gradle*
            project/android/settings.gradle*
            project/android/gradle.properties
            project/android/app/*.gradle*
            project/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build performance APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew clean assemblePerformance --no-daemon

      - name: Upload performance APK
        uses: actions/upload-artifact@v4
        with:
          name: Atmos-0.64.0-Performance-APK
          path: project/android/app/build/outputs/apk/performance/app-performance.apk
          if-no-files-found: error
