name: Build Atmos Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Atmos-Source-*.zip'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select most recently committed Atmos source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP=$(git log --diff-filter=AM --name-only --pretty=format: -- 'Atmos-Source-*.zip' \
            | awk 'NF && !seen[$0]++ { print; exit }')

          if [ -z "${SOURCE_ZIP:-}" ] || [ ! -f "$SOURCE_ZIP" ]; then
            echo "Could not identify the most recently committed Atmos source ZIP."
            echo "Available source ZIPs:"
            find . -maxdepth 1 -type f -name 'Atmos-Source-*.zip' -printf '%f\n' | sort -V
            exit 1
          fi

          echo "Selected source: ${SOURCE_ZIP}"
          echo "zip=${SOURCE_ZIP}" >> "$GITHUB_OUTPUT"

      - name: Extract selected source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q "${{ steps.source.outputs.zip }}" -d project

          GRADLEW=$(find project -maxdepth 4 -type f -name gradlew | head -n 1)
          if [ -z "${GRADLEW:-}" ]; then
            echo "Could not find gradlew in the selected source ZIP."
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          ANDROID_DIR=$(dirname "$GRADLEW")
          echo "ANDROID_DIR=${ANDROID_DIR}" >> "$GITHUB_ENV"
          echo "Android project: ${ANDROID_DIR}"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            ${{ env.ANDROID_DIR }}/**/*.gradle*
            ${{ env.ANDROID_DIR }}/**/gradle-wrapper.properties
            ${{ env.ANDROID_DIR }}/gradle/*.versions.toml

      - name: Read Atmos version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="${ANDROID_DIR}/app/build.gradle"
          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="${ANDROID_DIR}/app/build.gradle.kts"
          fi

          if [ ! -f "$BUILD_FILE" ]; then
            echo "Unable to find the app Gradle build file."
            exit 1
          fi

          VERSION=$(grep -E 'versionName[[:space:]]*[= ]' "$BUILD_FILE" \
            | head -n 1 \
            | sed -E 's/.*versionName[[:space:]]*[= ]+["'\'']([^"'\'']+)["'\''].*/\1/')

          if [ -z "${VERSION:-}" ]; then
            echo "Unable to read versionName from ${BUILD_FILE}."
            exit 1
          fi

          echo "Building Atmos ${VERSION}"
          echo "number=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x "${ANDROID_DIR}/gradlew"

      - name: Select Gradle build task
        id: gradle_task
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          TASKS=$(./gradlew --no-daemon :app:tasks --all)

          if grep -q '^assemblePerformance ' <<< "$TASKS"; then
            TASK=':app:assemblePerformance'
            OUTPUT_DIR='performance'
          elif grep -q '^assembleRelease ' <<< "$TASKS"; then
            echo "Performance task is unavailable; using the release variant."
            TASK=':app:assembleRelease'
            OUTPUT_DIR='release'
          elif grep -q '^assembleDebug ' <<< "$TASKS"; then
            echo "Performance and release tasks are unavailable; using debug."
            TASK=':app:assembleDebug'
            OUTPUT_DIR='debug'
          else
            echo "No supported Android APK assembly task was found."
            ./gradlew --no-daemon :app:tasks --all
            exit 1
          fi

          echo "task=${TASK}" >> "$GITHUB_OUTPUT"
          echo "output_dir=${OUTPUT_DIR}" >> "$GITHUB_OUTPUT"
          echo "Selected Gradle task: ${TASK}"

      - name: Build Atmos APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew --no-daemon --stacktrace "${{ steps.gradle_task.outputs.task }}"

      - name: Name APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          APK=$(find "${ANDROID_DIR}/app/build/outputs/apk/${{ steps.gradle_task.outputs.output_dir }}" \
            -type f -name '*.apk' | head -n 1)

          if [ -z "${APK:-}" ]; then
            echo "No APK was generated."
            find "${ANDROID_DIR}/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          OUTPUT="release/Atmos-${{ steps.version.outputs.number }}.apk"
          cp "$APK" "$OUTPUT"
          echo "Prepared ${OUTPUT}"

      - name: Remove older build artifacts
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          artifact_ids=$(gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GH_REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[5:] | .[].id')

          if [ -z "$artifact_ids" ]; then
            echo "No older artifacts to remove."
            exit 0
          fi

          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            echo "Deleting artifact ${artifact_id}"
            gh api --method DELETE "/repos/${GH_REPO}/actions/artifacts/${artifact_id}"
          done <<< "$artifact_ids"

      - name: Upload Atmos APK
        uses: actions/upload-artifact@v4
        with:
          name: Atmos-${{ steps.version.outputs.number }}
          path: release/Atmos-${{ steps.version.outputs.number }}.apk
          if-no-files-found: error
          retention-days: 1
