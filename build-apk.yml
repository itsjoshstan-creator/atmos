name: Build Atmos APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q Atmos-Source-0.10.18.zip -d project
          test -f project/android/gradlew
          test -f project/android/settings.gradle
          chmod +x project/android/gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            project/android/*.gradle
            project/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: project/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: cp project/android/app/build/outputs/apk/debug/app-debug.apk Atmos-0.10.18.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atmos-0.10.18-APK
          path: Atmos-0.10.18.apk
          if-no-files-found: error
          retention-days: 30
